
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-ml-app
  labels:
    app: weather-ml-app

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: weather-ml-app

  template:
    metadata:
      labels:
        app: weather-ml-app

    spec:
      containers:
        - name: weather-ml-app
          image: muhammadabid17/weather-ml-app:v2
          imagePullPolicy: Always

          ports:
            - containerPort: 5000
              protocol: TCP
