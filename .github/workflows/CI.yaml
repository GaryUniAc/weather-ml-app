name: CI Pipeline

on:
  push:
    branches: 
      - main
      - test-pipeline

jobs:
  build-test-ship:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python3 -m venv flaskappenv
          source flaskappenv/bin/activate
          pip install Flask numpy pandas scikit-learn

      - name: Run Integration Tests
        run: |
          source flaskappenv/bin/activate
          python3 -m unittest tests/integration_test.py

      - name: Run Smoke Tests
        run: |
          source flaskappenv/bin/activate
          python3 -m unittest tests/smoke_test.py

      - name: Run Unit Tests
        run: |
          source flaskappenv/bin/activate
          python3 -m unittest tests/unit_test.py

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: weather-ml-app:latest

      - name: Test Docker Image
        run: |
          docker run -d --name weather-test -p 5000:5000 weather-ml-app:latest
          sleep 5
          docker ps

      - name: Docker Login
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker tag weather-ml-app:latest ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:v2
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:v2
